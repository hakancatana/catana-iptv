<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Catana IPTV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app" class="app hidden">
  <aside class="sidebar">
    <button type="button" class="brand brand-btn" id="brandHome" title="Anasayfa">
      <div class="brand-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8"/><path d="M10.5 9l4 2-4 2z"/></svg></div>
      <span class="brand-name">Catana <span>IPTV</span></span>
    </button>
    <nav class="nav" aria-label="Menü">
      <button type="button" data-section="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>Anasayfa</button>
      <button type="button" data-section="live"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M17 2l-5 5-5-5"/></svg>Canlı TV</button>
      <button type="button" data-section="guide"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4M7 13h4M7 17h8"/></svg>TV Rehberi</button>
      <button type="button" data-section="multi"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg>Çoklu İzleme</button>
      <button type="button" data-section="vod"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 3v18M17 3v18M3 8h4M3 16h4M17 8h4M17 16h4"/></svg>Filmler</button>
      <button type="button" data-section="series"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l10 5-10 5L2 7z"/><path d="M2 12l10 5 10-5"/><path d="M2 17l10 5 10-5"/></svg>Diziler</button>
      <button type="button" data-section="favs"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/></svg>Favoriler</button>
      <button type="button" data-section="recent"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Son İzlenenler</button>
    </nav>
    <div class="grow"></div>
    <nav class="nav">
      <button type="button" id="refreshAll" title="Kanal, film ve dizi listelerini sunucudan yeniden çek"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/></svg>Yenile</button>
      <button type="button" data-section="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>Ayarlar</button>
      <button type="button" data-section="account"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Hesabım</button>
    </nav>
    <button type="button" class="update-box hidden" id="updateBox"></button>
    <div class="account hidden" id="account"></div>
  </aside>

  <main class="content">
    <header class="topbar">
      <h1 id="title">Canlı TV</h1>
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <span class="sr">Ara</span>
        <input id="search" type="search" placeholder="Kanal, film veya dizi ara…" autocomplete="off">
        <kbd>Ctrl K</kbd>
      </label>
      <div class="grow"></div>
      <select id="sort" class="select hidden" aria-label="Sıralama">
        <option value="added">Sırala: Eklenme tarihi</option>
        <option value="name">Sırala: A–Z</option>
        <option value="rating">Sırala: Puan</option>
      </select>
      <div class="seg hidden" id="viewToggle">
        <button type="button" data-view="list" aria-label="Liste görünümü"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></button>
        <button type="button" data-view="grid" aria-label="Izgara görünümü"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></button>
      </div>
      <button type="button" class="profile-btn" id="profileBtn"><span class="avatar" id="profileAvatar"></span><span id="profileName"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
    </header>
    <div id="view" class="view"></div>
  </main>
</div>

<!-- Giriş / profiller -->
<div id="login" class="login hidden">
  <div class="login-inner">
    <section class="card profiles-card" aria-label="Kayıtlı profiller">
      <div class="brand big">
        <div class="brand-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8"/><path d="M10.5 9l4 2-4 2z"/></svg></div>
        <span class="brand-name">Catana <span>IPTV</span></span>
      </div>
      <div>
        <h2>Kayıtlı profiller</h2>
        <p class="muted">Birden fazla Xtream hesabını kaydet, tek tıkla geçiş yap.</p>
      </div>
      <div id="profileList" class="profile-list"></div>
      <div class="grow"></div>
      <button type="button" id="loginClose" class="btn ghost hidden">Geri dön</button>
      <p class="muted small">Bilgiler yalnızca bu bilgisayarda saklanır.</p>
    </section>
    <form class="card form-card" id="loginForm" autocomplete="off">
      <div>
        <h1 id="formTitle">Profil ekle</h1>
        <p class="muted" id="formHint">Sağlayıcının verdiği sunucu adresini ve hesap bilgilerini gir.</p>
      </div>
      <div class="seg-tabs" role="tablist">
        <button type="button" role="tab" data-ftype="xtream" class="active">Xtream Codes</button>
        <button type="button" role="tab" data-ftype="m3u">M3U listesi</button>
      </div>
      <label class="field"><span>Profil adı</span><input name="name" placeholder="Örn. Ev Profili"></label>
      <label class="field f-m3u hidden"><span>M3U liste adresi</span><input name="m3u" placeholder="http://…/playlist.m3u"></label>
      <label class="field f-xtream"><span>Sunucu adresi</span><input name="server" placeholder="http://sunucu-adresi:port"></label>
      <div class="row2 f-xtream">
        <label class="field"><span>Kullanıcı adı</span><input name="username"></label>
        <label class="field"><span>Şifre</span>
          <span class="pw"><input name="password" type="password"><button type="button" id="pwToggle" aria-label="Şifreyi göster"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></span>
        </label>
      </div>
      <label class="check"><input type="checkbox" name="auto" checked> Açılışta bu profille otomatik bağlan</label>
      <p id="formMsg" class="form-msg" role="status"></p>
      <div class="actions">
        <button type="submit" class="btn primary" id="connectBtn">Bağlan ve kaydet</button>
        <button type="button" class="btn ghost" id="testBtn">Bağlantıyı test et</button>
      </div>
    </form>
  </div>
</div>

<!-- Oynatıcı -->
<div id="player" class="player hidden">
  <div id="playerStage" class="stage"></div>
  <header class="p-top">
    <button type="button" class="p-icon" id="pBack" aria-label="Geri"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
    <span class="p-logo" id="pLogo"></span>
    <div class="p-info">
      <div class="p-title"><span id="pTitle"></span><span class="live-badge hidden" id="pLive">CANLI</span></div>
      <div class="p-sub" id="pSub"></div>
    </div>
    <div class="grow"></div>
    <span class="p-tech" id="pTech"></span>
  </header>
  <aside class="p-side hidden" id="pSide" aria-label="Hızlı kanal geçişi">
    <nav class="p-side-cats" id="pSideCats" aria-label="Kategoriler"></nav>
    <div class="p-side-main">
      <div class="p-side-head" id="pSideHead">Kanallar</div>
      <div class="p-side-list" id="pSideList"><div id="pSideItems"></div></div>
      <div class="p-side-foot">↑ ↓ kanal değiştir · C kapat</div>
    </div>
  </aside>
  <div class="p-menu hidden" id="pMenu" role="dialog" aria-label="Oynatıcı ayarları">
    <div class="p-menu-head">
      <button type="button" class="p-icon hidden" id="pMenuBack" aria-label="Geri"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
      <span id="pMenuTitle">Ayarlar</span>
      <div class="grow"></div>
      <button type="button" class="p-icon boxed" id="pMenuClose" aria-label="Kapat"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="p-menu-body" id="pMenuBody"></div>
  </div>
  <footer class="p-bottom">
    <div class="p-progress" id="pProgress">
      <span id="pStart"></span>
      <div class="p-bar" id="pBar"><div class="p-fill" id="pFill"></div><div class="p-knob" id="pKnob"></div></div>
      <span id="pEnd"></span>
      <button type="button" class="live-btn hidden" id="pGoLive" title="Canlıya dön (L)"><span class="dot"></span>CANLI</button>
    </div>
    <div class="p-controls">
      <button type="button" class="p-icon" id="pPrev" aria-label="Önceki"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 20L9 12l10-8z"/><path d="M5 19V5"/></svg></button>
      <button type="button" class="p-play" id="pPlay" aria-label="Oynat / duraklat"><svg id="pPlayIcon" viewBox="0 0 24 24" aria-hidden="true"></svg></button>
      <button type="button" class="p-icon" id="pNext" aria-label="Sonraki"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4l10 8-10 8z"/><path d="M19 5v14"/></svg></button>
      <div class="p-vol">
        <button type="button" class="p-icon" id="pMute" aria-label="Sesi kapat"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg></button>
        <input type="range" id="pVolume" min="0" max="1" step="0.05" aria-label="Ses seviyesi">
      </div>
      <div class="grow"></div>
      <button type="button" class="p-btn" id="pChannels">Kanallar</button>
      <button type="button" class="p-icon" id="pPip" aria-label="Mini oynatıcı" title="Mini oynatıcı (P)"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><rect x="12" y="11" width="8" height="7" rx="1" fill="currentColor" stroke="none"/></svg></button>
      <button type="button" class="p-icon" id="pSettings" aria-label="Ayarlar" title="Ayarlar (S)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg></button>
      <button type="button" class="p-icon" id="pFull" aria-label="Tam ekran"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
  </footer>
</div>

<!-- Tek video öğesi: önizleme ile oynatıcı arasında taşınır, yayın yeniden açılmaz -->
<div id="videoWrap" class="video-wrap">
  <video id="video" playsinline></video>
  <div class="v-status hidden" id="vStatus">
    <div class="spinner" id="vSpin"></div>
    <span id="vMsg"></span>
    <button type="button" class="btn ghost small hidden" id="vRetry">Tekrar dene</button>
  </div>
</div>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true"><div class="modal-card" id="modalCard"></div></div>

<div id="toast" class="toast" role="status"></div>
<div id="loading" class="loading hidden"><div class="spinner"></div><span id="loadingText">Yükleniyor…</span></div>

<!-- Pencere düğmeleri (Windows/Linux) -->
<div id="winbar" class="winbar hidden">
  <button type="button" data-win="min" title="Simge durumuna küçült" aria-label="Simge durumuna küçült"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6h8"/></svg></button>
  <button type="button" data-win="max" title="Büyüt" aria-label="Büyüt"><svg class="i-max" viewBox="0 0 12 12" aria-hidden="true"><rect x="2" y="2" width="8" height="8" rx="1.6"/></svg><svg class="i-restore" viewBox="0 0 12 12" aria-hidden="true"><rect x="2" y="4" width="6" height="6" rx="1.4"/><path d="M4.2 2h4.2A1.6 1.6 0 0 1 10 3.6v4.2"/></svg></button>
  <button type="button" data-win="close" class="close" title="Kapat" aria-label="Kapat"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"/></svg></button>
</div>
<div class="drag-strip" aria-hidden="true"></div>

<script src="../node_modules/hls.js/dist/hls.min.js"></script>
<script src="../node_modules/mpegts.js/dist/mpegts.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
