name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Tip: **Settings → Report a problem** in the app fills in the version, system and logs for you.
        Please **never** post your server address, username, password or playlist URL.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Live TV
        2. Click on …
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "1.6.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11 / macOS 15 / Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Settings
      description: Language, profile type (Xtream / M3U), stream format, buffer.
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: text
